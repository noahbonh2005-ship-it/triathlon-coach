<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Triathlon Coach</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1014;--card:#171a20;--card2:#1d2128;--text:#f5f7fa;--muted:#9aa2ad;--line:#2a2f38;--accent:#b6ff3b;--blue:#63a9ff;--orange:#ff8a4c;--purple:#b68cff;--danger:#ff6262}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;padding-bottom:90px}.top{padding:28px 20px 16px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:5}.brand{font-size:13px;letter-spacing:.16em;color:var(--muted);font-weight:800}.title{font-size:30px;font-weight:850;margin-top:5px}.date{color:var(--muted);margin-top:5px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 20px 16px}.nav button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;padding:11px 6px;font-weight:750}.nav button.active{background:#232a18;color:var(--accent);border-color:#4c5e27}main{padding:0 20px}.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin:18px 0 10px}.hero{background:linear-gradient(145deg,#20261a,#171a20);border:1px solid #39452a;border-radius:24px;padding:22px;margin-bottom:14px}.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:4px 0;color:var(--muted)}.workout{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.workout.done{opacity:.62}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.discipline{font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.name{font-size:19px;font-weight:800;margin:5px 0}.meta{color:var(--muted);font-size:14px}.tag{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:var(--card2);color:var(--muted)}.tag.done{color:var(--accent);background:#202b17}.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--accent);color:#0b0d0b}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#351b1b;color:#ff9b9b}.week{overflow:auto;border:1px solid var(--line);border-radius:18px}.days{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));min-width:980px}.day{border-right:1px solid var(--line);padding:12px;min-height:210px}.day:last-child{border:0}.dayhead{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase}.daynum{font-size:16px;font-weight:850;margin:3px 0 9px}.mini{border-left:3px solid var(--accent);padding:9px 9px;background:var(--card);border-radius:9px;margin:7px 0;font-size:12px;cursor:pointer}.mini.run{border-color:var(--orange)}.mini.bike{border-color:var(--blue)}.mini.gym{border-color:var(--purple)}.mini .move{float:right;color:var(--muted);font-size:11px}.planner-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.week-title{font-size:18px;font-weight:850}.legend{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:750}.tabs button.active{color:var(--text);border-color:#555e6c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}.bar{height:9px;background:#252a32;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:900px;margin:auto;background:#14171c;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 5px}.close{float:right;border:0;background:var(--card2);color:var(--text);border-radius:50%;width:38px;height:38px}label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:14px 0 6px}.field{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.hint{padding:12px 14px;background:#181c22;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;margin:10px 0}.select-day{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px}.small{font-size:12px!important;padding:8px 10px!important}
@media(max-width:600px){.top{padding-top:22px}.title{font-size:27px}.stats{grid-template-columns:1fr 1fr}.nav{padding-left:12px;padding-right:12px}main{padding:0 12px}.nav button{font-size:12px}.grid2{grid-template-columns:1fr}.days{min-width:920px}}
</style>
</head><body><div class="app"><header class="top"><div class="brand">TRIATHLON COACH · GILEPPE TROPHY 2027</div><div class="title">Mon entraînement</div><div class="date" id="todayLabel"></div></header><nav class="nav"><button data-page="today" class="active">Aujourd'hui</button><button data-page="planning">Planning</button><button data-page="history">Historique</button><button data-page="progress">Progression</button></nav><main id="main"></main></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const STORAGE="triathlon-coach-v2";
const gym={"UPPER A":[["Développé couché incliné Machine Smith","6–10","2","2","3 min"],["Tirage poitrine poulie","6–10","2","2","3 min"],["Chest Press couché","8–12","2","1–2","2 min 30"],["Rowing assis machine","8–12","2","1–2","2 min 30"],["Élévation latérale un bras poulie","12–20","2","1–2","1 min 30"],["Curl biceps poulie","8–15","2","1–2","1 min 30"],["Extension triceps au-dessus de la tête poulie","8–15","2","1–2","1 min 30"],["Crunch poulie","10–15","2","2","1 min 30"]],"ANTERIOR":[["Écarté machine","8–12","2","2","3 min"],["Hack Squat machine","6–10","2","3","3 min"],["Développé épaules assis machine","8–12","2","2","3 min"],["Curl pupitre machine","8–15","2","1–2","2 min"],["Extension jambes machine","10–15","2","2","2 min"],["Curl inversé barre","10–15","2","1–2","2 min"],["Crunch poulie","10–15","2","2","1 min 30"]],"POSTERIOR":[["Tractions lestées","6–10","2","2","3 min"],["Rowing assis machine","8–12","2","1–2","2 min"],["Leg Curl assis machine","8–12","2","2","2 min 30"],["Relevé de bassin / Hip Thrust","8–12","2","2–3","2 min"],["Extension mollets debout machine","8–15","2","1–2","2 min"],["Extension triceps au-dessus de la tête poulie","8–15","2","1–2","1 min 30"],["Tirage vers le visage","12–20","2","1–2","1 min 30"]],"UPPER B":[["Chest Press couché","6–10","2","2","3 min"],["Tirage poitrine poulie","6–10","2","2","3 min"],["Développé couché incliné Machine Smith","8–12","2","1–2","2 min 30"],["Rowing assis prise large","8–12","2","1–2","2 min 30"],["Élévation latérale haltères","8–15","2","1–2","1 min 30"],["Curl derrière le dos poulie","8–15","2","1–2","1 min 30"],["Extension triceps poulie haute","8–15","2","1–2","1 min 30"],["Oiseau machine","12–20","2","1–2","1 min 30"]]};
const weekStarts=["2026-08-25","2026-09-01","2026-09-08","2026-09-15"];
const defaultWeeks={};
function addDays(s,n){let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function makeDefaults(){let arr=[];weekStarts.forEach((s,wi)=>{let days=[
[{type:"Musculation",name:"UPPER A",duration:"45–60 min",goal:"Haut du corps"}],
[{type:"Course",name:"Course à pied",duration:wi===0?"35–40 min":wi===1?"40–45 min":wi===2?"45–50 min":"35–40 min",goal:"Endurance facile"}],
[{type:"Musculation",name:"ANTERIOR",duration:"45–60 min",goal:"Antérieur + quadriceps"},{type:"Vélo",name:"Vélo",duration:wi===0?"50–60 min":wi===1?"60–70 min":wi===2?"70–80 min":"50–60 min",goal:"Endurance"}],
[{type:"Musculation",name:"POSTERIOR",duration:"45–60 min",goal:"Chaîne postérieure"},{type:"Course",name:"Course à pied",duration:wi===0?"35–40 min":wi===1?"40–45 min":wi===2?"45–50 min":"35–40 min",goal:"Endurance facile"}],
[{type:"Vélo",name:"Vélo",duration:wi===0?"45–55 min":wi===1?"50–60 min":wi===2?"55–65 min":"45–55 min",goal:"Endurance"}],
[{type:"Musculation",name:"UPPER B",duration:"45–60 min",goal:"Haut du corps"},{type:"Course",name:"Course à pied",duration:wi===0?"30–35 min":wi===1?"35–40 min":wi===2?"40–45 min":"30–35 min",goal:"Endurance facile"}],
[{type:"Vélo",name:"Vélo",duration:wi===0?"65–75 min":wi===1?"75–85 min":wi===2?"85–90 min":"65–75 min",goal:"Endurance"}]
];days.forEach((items,i)=>items.forEach(x=>arr.push({...x,id:crypto.randomUUID(),date:addDays(s,i)})))});return arr}
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE));if(x&&Array.isArray(x.plan))return x; }catch(e){} return {plan:makeDefaults(),results:[]}}
let state=load(),page="today";function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function isoToday(){return new Date().toISOString().slice(0,10)}function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long"})}function icon(t){return t==="Course"?"🏃":t==="Vélo"?"🚴":"🏋️"}function typeClass(t){return t==="Course"?"run":t==="Vélo"?"bike":"gym"}
function key(date,type,name,id){return date+"|"+type+"|"+(id||name)}function getResult(x){return state.results.find(r=>r.key===key(x.date,x.type,x.name,x.id)||r.key===key(x.date,x.type,x.name))}
function renderToday(){let today=isoToday();document.getElementById("todayLabel").textContent=fmtDate(today);let items=state.plan.filter(x=>x.date===today);let h=`<div class="section-title">Séance du jour</div>`;if(!items.length)h+=`<div class="hero"><h2>🛌 Repos / hors planning</h2><p>Aucune séance planifiée aujourd’hui.</p><div class="actions"><button class="btn" onclick="openCreate('${today}')">+ Ajouter une séance</button></div></div>`;else items.forEach(x=>h+=card(x));let future=state.plan.filter(x=>x.date>today).sort((a,b)=>a.date.localeCompare(b.date))[0];if(future){h+=`<div class="section-title">Prochaine séance</div>`+card(future,true)}document.getElementById("main").innerHTML=h}
function card(x,next=false){let r=getResult(x),done=!!r;return `<div class="workout ${done?"done":""}"><div class="row"><div><div class="discipline">${icon(x.type)} ${x.type}</div><div class="name">${esc(x.name)}</div></div><span class="tag ${done?"done":""}">${done?"✓ Réalisée":next?"À venir":esc(x.duration)}</span></div><div class="meta">${esc(x.duration)} · ${esc(x.goal||"")}</div><div class="actions"><button class="btn secondary" onclick='openWorkout(${JSON.stringify(x)})'>${done?"Voir le compte rendu":"Détailler"}</button>${!done?`<button class="btn" onclick='openLog(${JSON.stringify(x)})'>Terminer</button>`:""}<button class="btn secondary small" onclick='openEdit(${JSON.stringify(x)})'>Modifier</button></div></div>`}
function renderPlanning(){let today=isoToday(), base=new Date(today+"T12:00:00"), day=(base.getDay()+6)%7, monday=new Date(base);monday.setDate(base.getDate()-day);let s=monday.toISOString().slice(0,10);let h='<div class="planner-tools"><div><div class="week-title">Ma semaine</div><div class="legend">Clique sur une séance pour la modifier ou la déplacer.</div></div><button class="btn" onclick="openCreate()">+ Nouvelle séance</button></div><div class="week"><div class="days">';for(let i=0;i<7;i++){let date=addDays(s,i),items=state.plan.filter(x=>x.date===date);h+=`<div class="day" ondragover="event.preventDefault()" ondrop="dropTo('${date}')"><div class="dayhead">${new Date(date+"T12:00:00").toLocaleDateString("fr-BE",{weekday:"short"})}</div><div class="daynum">${new Date(date+"T12:00:00").getDate()}</div>${items.length?items.map(x=>`<div class="mini ${typeClass(x.type)}" draggable="true" ondragstart="dragId='${x.id}'" onclick='openEdit(${JSON.stringify(x)})'><span class="move">↕</span><b>${icon(x.type)} ${esc(x.name)}</b><br>${esc(x.duration)}</div>`).join(""):'<div class="meta">Repos</div>'}<button class="btn secondary small" style="margin-top:8px;width:100%" onclick="openCreate('${date}')">+ Ajouter</button></div>`}h+='</div></div><div class="hint">💡 <b>Déplacer :</b> sur ordinateur, fais glisser une séance vers un autre jour. Tu peux aussi la modifier et choisir directement une nouvelle date.</div>';document.getElementById("main").innerHTML=h}
let dragId=null;function dropTo(date){let x=state.plan.find(a=>a.id===dragId);if(x){x.date=date;save();renderPlanning();renderToday()}}
function openCreate(date){let d=date||isoToday();document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Nouvelle séance</h2><div class="date">Ajoute-la où tu veux dans ton planning.</div><form id="createForm"><label>Date</label><input class="field" type="date" name="date" value="${d}"><label>Discipline</label><select class="field" name="type"><option>Course</option><option>Vélo</option><option>Musculation</option><option>Natation</option><option>Repos</option><option>Autre</option></select><label>Nom de la séance</label><input class="field" name="name" placeholder="ex. Course à pied"><div class="grid2"><div><label>Durée</label><input class="field" name="duration" placeholder="ex. 45 min"></div><div><label>Objectif / intensité</label><input class="field" name="goal" placeholder="ex. endurance facile"></div></div><div class="actions"><button class="btn" type="submit">Créer la séance</button><button class="btn secondary" type="button" onclick="closeModal()">Annuler</button></div></form>`;document.getElementById("createForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let x={id:crypto.randomUUID(),date:f.get("date"),type:f.get("type"),name:f.get("name")||f.get("type"),duration:f.get("duration")||"—",goal:f.get("goal")||""};state.plan.push(x);save();closeModal();render()};document.getElementById("modal").classList.add("show")}
function openEdit(x){document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="discipline">${icon(x.type)} ${esc(x.type)}</div><h2>Modifier la séance</h2><form id="editForm"><label>Date</label><input class="field" type="date" name="date" value="${x.date}"><label>Discipline</label><select class="field" name="type">${["Course","Vélo","Musculation","Natation","Repos","Autre"].map(t=>`<option ${t===x.type?"selected":""}>${t}</option>`).join("")}</select><label>Nom</label><input class="field" name="name" value="${escAttr(x.name)}"><div class="grid2"><div><label>Durée</label><input class="field" name="duration" value="${escAttr(x.duration)}"></div><div><label>Objectif / intensité</label><input class="field" name="goal" value="${escAttr(x.goal||"")}"></div></div><div class="actions"><button class="btn" type="submit">Enregistrer</button><button class="btn danger" type="button" onclick='deleteWorkout("${x.id}")'>Supprimer</button></div></form>`;document.getElementById("editForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(x,{date:f.get("date"),type:f.get("type"),name:f.get("name")||f.get("type"),duration:f.get("duration")||"—",goal:f.get("goal")||""});save();closeModal();render()};document.getElementById("modal").classList.add("show")}
function deleteWorkout(id){if(confirm("Supprimer cette séance du planning ?")){state.plan=state.plan.filter(x=>x.id!==id);state.results=state.results.filter(r=>!r.key.includes(id));save();closeModal();render()}}
function openWorkout(x){let detail="";if(x.type==="Musculation"&&gym[x.name]){detail='<div class="section-title">Programme</div>'+gym[x.name].map(function(e,i){return '<div class="workout"><div class="name">'+(i+1)+'. '+esc(e[0])+'</div><div class="meta">'+esc(e[2])+' séries · '+esc(e[1])+' reps · RIR '+esc(e[3])+' · repos '+esc(e[4])+'</div></div>';}).join("")}else{detail='<div class="hero"><h2>'+esc(x.goal||"Séance")+'</h2><p>'+esc(x.duration)+'</p><p>Reste facile et régulier. L’objectif est de construire la base, pas de tester tes limites.</p></div>'}let r=getResult(x);let action=r?'<button class="btn secondary" onclick="openResultById(\''+x.id+'\')">Voir le compte rendu</button>':'<button class="btn" onclick="openLogById(\''+x.id+'\')">Marquer comme réalisée</button>';document.getElementById("sheet").innerHTML='<button class="close" onclick="closeModal()">×</button><div class="discipline">'+icon(x.type)+' '+esc(x.type)+'</div><h2>'+esc(x.name)+'</h2><div class="date">'+fmtDate(x.date)+' · '+esc(x.duration)+'</div>'+detail+'<div class="actions">'+action+'<button class="btn secondary" onclick="openEditById(\''+x.id+'\')">Modifier</button></div>';document.getElementById("modal").classList.add("show")}
function openWorkoutById(id){let x=state.plan.find(a=>a.id===id);if(x)openWorkout(x)}
function openLogById(id){let x=state.plan.find(a=>a.id===id);if(x)openLog(x)}
function openEditById(id){let x=state.plan.find(a=>a.id===id);if(x)openEdit(x)}
function openResultById(id){let r=state.results.find(a=>a.id===id);if(r)openResult(r)}
function openLog(x){document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="discipline">${icon(x.type)} ${esc(x.type)}</div><h2>${esc(x.name)}</h2><div class="date">${fmtDate(x.date)}</div><form id="logForm"><div class="grid2"><div><label>Durée réelle</label><input class="field" name="duration" placeholder="ex. 42 min"></div><div><label>RPE /10</label><input class="field" name="rpe" type="number" min="1" max="10" step="1" placeholder="6"></div></div>${x.type==="Course"?`<div class="grid2"><div><label>Distance</label><input class="field" name="distance" placeholder="ex. 6,8 km"></div><div><label>Allure moyenne</label><input class="field" name="pace" placeholder="ex. 6:10/km"></div><div><label>FC moyenne</label><input class="field" name="hr" placeholder="ex. 143 bpm"></div><div><label>Cadence</label><input class="field" name="cadence" placeholder="ex. 160 spm"></div></div>`:""}${x.type==="Vélo"?`<div class="grid2"><div><label>Distance</label><input class="field" name="distance" placeholder="ex. 18 km"></div><div><label>Vitesse moyenne</label><input class="field" name="speed" placeholder="ex. 24 km/h"></div><div><label>FC moyenne</label><input class="field" name="hr" placeholder="ex. 137 bpm"></div><div><label>D+ </label><input class="field" name="elevation" placeholder="ex. 150 m"></div></div>`:""}${x.type==="Musculation"?`<label>Courbatures / fatigue</label><input class="field" name="fatigue" placeholder="ex. jambes légères"><label>Charges / reps importantes</label><textarea class="field" name="strength" rows="3" placeholder="ex. Hack squat 80×8×2, RIR 3"></textarea>`:""}<label>Sensations / douleur éventuelle</label><input class="field" name="feel" placeholder="ex. bonnes sensations, aucune gêne"><label>Commentaire</label><textarea class="field" name="comment" rows="3" placeholder="Une note rapide après la séance…"></textarea><div class="actions"><button class="btn" type="submit">Enregistrer la séance</button><button class="btn secondary" type="button" onclick="closeModal()">Annuler</button></div></form>`;document.getElementById("logForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r={key:key(x.date,x.type,x.name,x.id),date:x.date,type:x.type,name:x.name,id:x.id};for(let [k,v] of f.entries())r[k]=v;state.results=state.results.filter(a=>a.key!==r.key);state.results.push(r);save();closeModal();render()};document.getElementById("modal").classList.add("show")}
function openResult(r){document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="discipline">${icon(r.type)} ${r.type}</div><h2>${esc(r.name)}</h2><div class="date">${fmtDate(r.date)}</div><div class="workout"><div class="meta">Durée</div><div class="name">${esc(r.duration||"—")}</div><div class="meta">RPE ${esc(r.rpe||"—")}/10</div></div><div class="workout"><div class="meta">Données</div><div class="meta" style="white-space:pre-wrap;margin-top:8px">${Object.entries(r).filter(([k])=>!['key','date','type','name','id','duration','rpe'].includes(k)&&r[k]).map(([k,v])=>esc(k)+" : "+esc(v)).join("\n")||"Aucune donnée supplémentaire."}</div></div><div class="actions"><button class="btn danger" onclick='deleteResult(${JSON.stringify(r.key)})'>Supprimer</button></div>`;document.getElementById("modal").classList.add("show")}
function deleteResult(k){state.results=state.results.filter(r=>r.key!==k);save();closeModal();render()}
function renderHistory(){let rs=[...state.results].sort((a,b)=>b.date.localeCompare(a.date));let h='<div class="section-title">Séances réalisées</div>';if(!rs.length)h+='<div class="empty">Aucune séance enregistrée pour le moment.</div>';rs.forEach(r=>h+=`<div class="workout"><div class="row"><div><div class="discipline">${icon(r.type)} ${esc(r.type)}</div><div class="name">${esc(r.name)}</div></div><span class="tag done">✓</span></div><div class="meta">${fmtDate(r.date)} · ${esc(r.duration||"—")} · RPE ${esc(r.rpe||"—")}/10</div><div class="actions"><button class="btn secondary" onclick='openResult(${JSON.stringify(r)})'>Voir</button></div></div>`);document.getElementById("main").innerHTML=h}
function renderProgress(){let rs=state.results;let total=state.plan.length,done=rs.length,pct=total?Math.min(100,done/total*100):0;const by=t=>rs.filter(r=>r.type===t).length;document.getElementById("main").innerHTML=`<div class="section-title">Vue d'ensemble</div><div class="stats"><div class="stat"><b>${done}</b><span>séances réalisées</span></div><div class="stat"><b>${by("Course")}</b><span>courses</span></div><div class="stat"><b>${by("Vélo")}</b><span>sorties vélo</span></div></div><div class="workout" style="margin-top:12px"><div class="row"><b>Régularité du programme</b><span>${Math.round(pct)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="meta" style="margin-top:8px">${done} séances enregistrées sur ${total} actuellement planifiées.</div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='today')renderToday();if(page==='planning')renderPlanning();if(page==='history')renderHistory();if(page==='progress')renderProgress()}
function closeModal(){document.getElementById('modal').classList.remove('show')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script></body></html>
