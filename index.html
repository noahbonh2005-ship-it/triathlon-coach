<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Triathlon Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <style>
    :root{--bg:#0e1014;--card:#171a20;--card2:#1d2128;--text:#f5f7fa;--muted:#9aa2ad;--line:#2a2f38;--accent:#b6ff3b;--blue:#63a9ff;--orange:#ff8a4c;--purple:#b68cff;--danger:#ff6262}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .app{max-width:900px;margin:auto;padding-bottom:90px}.top{padding:28px 20px 16px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:5}
    .brand{font-size:13px;letter-spacing:.16em;color:var(--muted);font-weight:800}.title{font-size:30px;font-weight:850;margin-top:5px}.date{color:var(--muted);margin-top:5px}
    .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 20px 16px}.nav button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;padding:11px 6px;font-weight:750}.nav button.active{background:#232a18;color:var(--accent);border-color:#4c5e27}
    main{padding:0 20px}.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin:18px 0 10px}
    .hero{background:linear-gradient(145deg,#20261a,#171a20);border:1px solid #39452a;border-radius:24px;padding:22px;margin-bottom:14px}.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:4px 0;color:var(--muted)}
    .workout{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.workout.done{opacity:.62}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.discipline{font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.name{font-size:19px;font-weight:800;margin:5px 0}.meta{color:var(--muted);font-size:14px}.tag{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:var(--card2);color:var(--muted)}.tag.done{color:var(--accent);background:#202b17}
    .actions{display:flex;gap:8px;margin-top:13px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--accent);color:#0b0d0b}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#351b1b;color:#ff9b9b}
    .week{overflow:auto;border:1px solid var(--line);border-radius:18px}.days{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));min-width:760px}.day{border-right:1px solid var(--line);padding:12px;min-height:145px}.day:last-child{border:0}.dayhead{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase}.daynum{font-size:16px;font-weight:850;margin:3px 0 9px}.mini{border-left:3px solid var(--accent);padding:7px 8px;background:var(--card);border-radius:8px;margin:7px 0;font-size:12px}.mini.run{border-color:var(--orange)}.mini.bike{border-color:var(--blue)}.mini.gym{border-color:var(--purple)}
    .tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:750}.tabs button.active{color:var(--text);border-color:#555e6c}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}
    .bar{height:9px;background:#252a32;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:20px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:900px;margin:auto;background:#14171c;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 5px}.close{float:right;border:0;background:var(--card2);color:var(--text);border-radius:50%;width:38px;height:38px}
    label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:14px 0 6px}.field{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:35px 10px}
    @media(max-width:600px){.top{padding-top:22px}.title{font-size:27px}.stats{grid-template-columns:1fr 1fr}.nav{padding-left:12px;padding-right:12px}main{padding:0 12px}.nav button{font-size:12px}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">TRIATHLON COACH · GILEPPE TROPHY 2027</div>
    <div class="title">Mon entraînement</div>
    <div class="date" id="todayLabel"></div>
  </header>
  <nav class="nav">
    <button data-page="today" class="active">Aujourd'hui</button>
    <button data-page="planning">Planning</button>
    <button data-page="history">Historique</button>
    <button data-page="progress">Progression</button>
  </nav>
  <main id="main"></main>
</div>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const STORAGE="triathlon-coach-v1";
const weeks=[
 {start:"2026-08-25",label:"Semaine 1 · 25–31 août",runs:["35–40","35–40"],bike1:"50–60",bike2:"65–75"},
 {start:"2026-09-01",label:"Semaine 2 · 1–7 septembre",runs:["40–45","40–45"],bike1:"60–70",bike2:"75–85"},
 {start:"2026-09-08",label:"Semaine 3 · 8–14 septembre",runs:["45–50","45–50"],bike1:"70–80",bike2:"85–90"},
 {start:"2026-09-15",label:"Semaine 4 · 15–21 septembre",runs:["35–40","35–40"],bike1:"50–60",bike2:"65–75"}
];
const gym={
 "UPPER A":[["Développé couché incliné Machine Smith","6–10","2","2","3 min"],["Tirage poitrine poulie","6–10","2","2","3 min"],["Chest Press couché","8–12","2","1–2","2 min 30"],["Rowing assis machine","8–12","2","1–2","2 min 30"],["Élévation latérale un bras poulie","12–20","2","1–2","1 min 30"],["Curl biceps poulie","8–15","2","1–2","1 min 30"],["Extension triceps au-dessus de la tête poulie","8–15","2","1–2","1 min 30"],["Crunch poulie","10–15","2","2","1 min 30"]],
 "ANTERIOR":[["Écarté machine","8–12","2","2","3 min"],["Hack Squat machine","6–10","2","3","3 min"],["Développé épaules assis machine","8–12","2","2","3 min"],["Curl pupitre machine","8–15","2","1–2","2 min"],["Extension jambes machine","10–15","2","2","2 min"],["Curl inversé barre","10–15","2","1–2","2 min"],["Crunch poulie","10–15","2","2","1 min 30"]],
 "POSTERIOR":[["Tractions lestées","6–10","2","2","3 min"],["Rowing assis machine","8–12","2","1–2","2 min"],["Leg Curl assis machine","8–12","2","2","2 min 30"],["Relevé de bassin / Hip Thrust","8–12","2","2–3","2 min"],["Extension mollets debout machine","8–15","2","1–2","2 min"],["Extension triceps au-dessus de la tête poulie","8–15","2","1–2","1 min 30"],["Tirage vers le visage","12–20","2","1–2","1 min 30"]],
 "UPPER B":[["Chest Press couché","6–10","2","2","3 min"],["Tirage poitrine poulie","6–10","2","2","3 min"],["Développé couché incliné Machine Smith","8–12","2","1–2","2 min 30"],["Rowing assis prise large","8–12","2","1–2","2 min 30"],["Élévation latérale haltères","8–15","2","1–2","1 min 30"],["Curl derrière le dos poulie","8–15","2","1–2","1 min 30"],["Extension triceps poulie haute","8–15","2","1–2","1 min 30"],["Oiseau machine","12–20","2","1–2","1 min 30"]]
};
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||{results:[]}}catch(e){return {results:[]}}}
let state=load(), page="today";
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long"})}
function iso(d){return d.toISOString().slice(0,10)}
function mondayOf(s){let d=new Date(s+"T12:00:00"), day=d.getDay(); let diff=(day+6)%7; d.setDate(d.getDate()-diff); return iso(d)}
function currentWeek(){let today=iso(new Date()); return weeks.find(w=>today>=w.start && today<=addDays(w.start,6))||weeks[0]}
function addDays(s,n){let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function key(date,type,name){return date+"|"+type+"|"+name}
function getResult(date,type,name){return state.results.find(x=>x.key===key(date,type,name))}
function typeClass(type){return type==="Course"?"run":type==="Vélo"?"bike":"gym"}
function workoutsForWeek(w){
 const out=[];
 out.push({date:w.start,type:"Musculation",name:"UPPER A",duration:"45–60 min",goal:"Haut du corps"});
 out.push({date:addDays(w.start,1),type:"Course",name:"Course à pied",duration:w.runs[0]+" min",goal:"Endurance facile"});
 out.push({date:addDays(w.start,2),type:"Musculation",name:"ANTERIOR",duration:"45–60 min",goal:"Antérieur + quadriceps"});
 out.push({date:addDays(w.start,2),type:"Vélo",name:"Vélo",duration:w.bike1+" min",goal:"Endurance"});
 out.push({date:addDays(w.start,3),type:"Musculation",name:"POSTERIOR",duration:"45–60 min",goal:"Chaîne postérieure"});
 out.push({date:addDays(w.start,4),type:"Course",name:"Course à pied",duration:w.runs[1]+" min",goal:"Endurance facile"});
 out.push({date:addDays(w.start,5),type:"Musculation",name:"UPPER B",duration:"45–60 min",goal:"Haut du corps"});
 out.push({date:addDays(w.start,6),type:"Vélo",name:"Vélo",duration:w.bike2+" min",goal:"Endurance"});
 return out;
}
const allWorkouts=()=>weeks.flatMap(workoutsForWeek);
function renderToday(){
 const today=iso(new Date()), items=allWorkouts().filter(x=>x.date===today);
 document.getElementById("todayLabel").textContent=fmtDate(today);
 let h='<div class="section-title">Séance du jour</div>';
 if(!items.length) h+='<div class="hero"><h2>🛌 Repos / hors planning</h2><p>Aucune séance planifiée pour aujourd’hui.</p></div>';
 else items.forEach(x=>h+=card(x));
 h+='<div class="section-title">Prochaine séance</div>';
 const next=allWorkouts().filter(x=>x.date>today)[0];
 if(next) h+=card(next,true);
 document.getElementById("main").innerHTML=h;
}
function card(x,next=false){
 const r=getResult(x.date,x.type,x.name), done=!!r;
 return `<div class="workout ${done?"done":""}">
   <div class="row"><div><div class="discipline">${icon(x.type)} ${x.type}</div><div class="name">${x.name}</div></div><span class="tag ${done?"done":""}">${done?"✓ Réalisée":next?"À venir":x.duration}</span></div>
   <div class="meta">${x.duration} · ${x.goal}</div>
   <div class="actions"><button class="btn secondary" onclick='openWorkout(${JSON.stringify(x)})'>${done?"Voir le compte rendu":"Détailler"}</button>${!done?`<button class="btn" onclick='openLog(${JSON.stringify(x)})'>Terminer</button>`:""}</div>
 </div>`;
}
function icon(t){return t==="Course"?"🏃":t==="Vélo"?"🚴":"🏋️"}
function renderPlanning(){
 const w=currentWeek(); let h=`<div class="section-title">${w.label}</div><div class="week"><div class="days">`;
 for(let i=0;i<7;i++){let date=addDays(w.start,i), items=allWorkouts().filter(x=>x.date===date);h+=`<div class="day"><div class="dayhead">${new Date(date+"T12:00:00").toLocaleDateString("fr-BE",{weekday:"short"})}</div><div class="daynum">${new Date(date+"T12:00:00").getDate()}</div>${items.map(x=>`<div class="mini ${typeClass(x.type)}" onclick='openWorkout(${JSON.stringify(x)})'><b>${icon(x.type)} ${x.name}</b><br>${x.duration}</div>`).join("")}</div>`}
 h+='</div></div><div class="section-title">Les 4 premières semaines</div>';
 weeks.forEach((wk,idx)=>{h+=`<div class="workout"><div class="row"><div><b>${wk.label}</b><div class="meta">Progression contrôlée</div></div><span class="tag">S${idx+1}</span></div><div class="meta" style="margin-top:8px">Course ${wk.runs[0]}–${wk.runs[1]} min · Vélo ${wk.bike1} + ${wk.bike2} min</div></div>`});
 document.getElementById("main").innerHTML=h;
}
function renderHistory(){
 let rs=[...state.results].sort((a,b)=>b.date.localeCompare(a.date));
 let h='<div class="section-title">Séances réalisées</div><div class="tabs"><button class="active">Toutes</button><button>Course</button><button>Vélo</button><button>Musculation</button></div>';
 if(!rs.length) h+='<div class="empty">Aucune séance enregistrée pour le moment.</div>';
 rs.forEach(r=>h+=`<div class="workout"><div class="row"><div><div class="discipline">${icon(r.type)} ${r.type}</div><div class="name">${r.name}</div></div><span class="tag done">✓</span></div><div class="meta">${fmtDate(r.date)} · ${r.duration||"—"} · RPE ${r.rpe||"—"}/10</div><div class="actions"><button class="btn secondary" onclick='openResult(${JSON.stringify(r)})'>Voir</button></div></div>`);
 document.getElementById("main").innerHTML=h;
}
function renderProgress(){
 const rs=state.results, total=allWorkouts().length, done=rs.length, pct=total?Math.min(100,done/total*100):0;
 const by=t=>rs.filter(r=>r.type===t).length;
 document.getElementById("main").innerHTML=`<div class="section-title">Vue d'ensemble</div>
 <div class="stats"><div class="stat"><b>${done}</b><span>séances réalisées</span></div><div class="stat"><b>${by("Course")}</b><span>courses</span></div><div class="stat"><b>${by("Vélo")}</b><span>sorties vélo</span></div></div>
 <div class="workout" style="margin-top:12px"><div class="row"><b>Régularité du programme</b><span>${Math.round(pct)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="meta" style="margin-top:8px">${done} séances enregistrées sur ${total} prévues dans les 4 semaines affichées.</div></div>
 <div class="section-title">Données à construire</div>
 <div class="empty">À mesure que tu m'enverras tes vraies données (distance, allure, FC, RPE, cadence, puissance…), cette page pourra devenir notre tableau de progression.</div>`;
}
function openWorkout(x){
 let detail="";
 if(x.type==="Musculation"){
   detail=`<div class="section-title">Programme</div>${gym[x.name].map((e,i)=>`<div class="workout"><div class="name">${i+1}. ${e[0]}</div><div class="meta">${e[2]} séries · ${e[1]} reps · RIR ${e[3]} · repos ${e[4]}</div></div>`).join("")}
 }else detail=`<div class="hero"><h2>${x.goal}</h2><p>${x.duration}</p><p>Reste facile et régulier. L’objectif est de construire la base, pas de tester tes limites.</p></div>`;
 const r=getResult(x.date,x.type,x.name);
 document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="discipline">${icon(x.type)} ${x.type}</div><h2>${x.name}</h2><div class="date">${fmtDate(x.date)} · ${x.duration}</div>${detail}<div class="actions">${r?`<button class="btn secondary" onclick='openResult(${JSON.stringify(r)})'>Voir le compte rendu</button>`:`<button class="btn" onclick='openLog(${JSON.stringify(x)})'>Marquer comme réalisée</button>`}</div>`;
 document.getElementById("modal").classList.add("show");
}
function openLog(x){
 document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="discipline">${icon(x.type)} ${x.type}</div><h2>${x.name}</h2><div class="date">${fmtDate(x.date)}</div>
 <form id="logForm">
 <div class="grid2"><div><label>Durée réelle</label><input class="field" name="duration" placeholder="ex. 42 min"></div><div><label>RPE /10</label><input class="field" name="rpe" type="number" min="1" max="10" step="1" placeholder="6"></div></div>
 ${x.type==="Course"?`<div class="grid2"><div><label>Distance</label><input class="field" name="distance" placeholder="ex. 6,8 km"></div><div><label>Allure moyenne</label><input class="field" name="pace" placeholder="ex. 6:10/km"></div><div><label>FC moyenne</label><input class="field" name="hr" placeholder="ex. 143 bpm"></div><div><label>Cadence</label><input class="field" name="cadence" placeholder="ex. 160 spm"></div></div>`:""}
 ${x.type==="Vélo"?`<div class="grid2"><div><label>Distance</label><input class="field" name="distance" placeholder="ex. 18 km"></div><div><label>Vitesse moyenne</label><input class="field" name="speed" placeholder="ex. 24 km/h"></div><div><label>FC moyenne</label><input class="field" name="hr" placeholder="ex. 137 bpm"></div><div><label>D+ </label><input class="field" name="elevation" placeholder="ex. 150 m"></div></div>`:""}
 ${x.type==="Musculation"?`<label>Courbatures / fatigue</label><input class="field" name="fatigue" placeholder="ex. jambes légères"><label>Charges / reps importantes</label><textarea class="field" name="strength" rows="3" placeholder="ex. Hack squat 80×8×2, RIR 3"></textarea>`:""}
 <label>Sensations / douleur éventuelle</label><input class="field" name="feel" placeholder="ex. bonnes sensations, aucune gêne">
 <label>Commentaire</label><textarea class="field" name="comment" rows="3" placeholder="Une note rapide après la séance…"></textarea>
 <div class="actions"><button class="btn" type="submit">Enregistrer la séance</button><button class="btn secondary" type="button" onclick="closeModal()">Annuler</button></div>
 </form>`;
 document.getElementById("logForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r={key:key(x.date,x.type,x.name),date:x.date,type:x.type,name:x.name};for(let [k,v] of f.entries())r[k]=v;state.results=state.results.filter(a=>a.key!==r.key);state.results.push(r);save();closeModal();render();};
 document.getElementById("modal").classList.add("show");
}
function openResult(r){document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="discipline">${icon(r.type)} ${r.type}</div><h2>${r.name}</h2><div class="date">${fmtDate(r.date)}</div><div class="workout"><div class="meta">Durée</div><div class="name">${r.duration||"—"}</div><div class="meta">RPE ${r.rpe||"—"}/10</div></div><div class="workout"><div class="meta">Données</div><div class="meta" style="white-space:pre-wrap;margin-top:8px">${Object.entries(r).filter(([k])=>!["key","date","type","name","duration","rpe"].includes(k)&&r[k]).map(([k,v])=>k+" : "+v).join("\\n")||"Aucune donnée supplémentaire."}</div></div><div class="actions"><button class="btn danger" onclick='deleteResult("${r.key}")'>Supprimer</button></div>`;document.getElementById("modal").classList.add("show")}
function deleteResult(k){state.results=state.results.filter(r=>r.key!==k);save();closeModal();render()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="today")renderToday();if(page==="planning")renderPlanning();if(page==="history")renderHistory();if(page==="progress")renderProgress()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
render();
</script>
</body>
</html>
